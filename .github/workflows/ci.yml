name: CI

# Continuous Integration: every pull request and every push to main is checked, and the exact
# artifact that will be deployed is built ONCE here. The CD workflow (cd.yml) ships that same artifact.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# a newer push to the same branch/PR cancels the older run (saves minutes, avoids stale results)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (exactly the versions in package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The temporary demo sign-in list is a secret, so it is not in the repository.
      - name: Provide the demo sign-in config
        env:
          VITE_DEMO_USERS: ${{ secrets.VITE_DEMO_USERS }}
        run: |
          if [ -n "$VITE_DEMO_USERS" ]; then
            printf "VITE_DEMO_USERS='%s'\n" "$VITE_DEMO_USERS" > apps/login/.env.production.local
          else
            echo "::warning::VITE_DEMO_USERS secret is not set - the built login page will have sign-in disabled"
          fi

      - name: Build the deployable artifact (login + dashboard)
        run: bash infra/deploy/build-site.sh

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-site
          path: dist-site/portal-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  python:
    name: Python tests (data scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest apps/dashboard/scripts -q

  infra:
    name: Infrastructure checks (shell, nginx, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck the deployment scripts
        run: shellcheck -x --severity=warning infra/deploy/*.sh

      - name: Validate the nginx site with the same nginx version as the server (1.18)
        run: |
          cat > "$RUNNER_TEMP/nginx.conf" <<'EOF'
          events {}
          http {
            include /etc/nginx/mime.types;
            include /conf/upavp-portal.conf;
          }
          EOF
          docker run --rm \
            -v "$PWD/infra/nginx:/conf:ro" \
            -v "$RUNNER_TEMP/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.18 nginx -t

      - name: Lint the GitHub workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  security:
    name: Security (secrets + dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans the whole history, not just the latest commit

      - name: Scan for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact --verbose

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit the dependencies that ship to users
        run: npm audit --omit=dev --audit-level=high

  # One stable name to require in branch protection: green only if every job above is green.
  ci-ok:
    name: CI passed
    if: always()
    needs: [web, python, infra, security]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::at least one CI job did not succeed"; exit 1
          fi
