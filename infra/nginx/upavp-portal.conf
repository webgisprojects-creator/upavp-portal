# UPAVP portal - ONE site on pre-production-testing (27.100.38.131)
#   /              login page (React/Vite, built from ./login)
#   /AwasVikas/    dashboard  (React/Vite build, base path /AwasVikas/)
#   /geoserver/    same-origin proxy to GeoServer 162.245.218.6:8080 (OGC endpoints only)
# Installed as /etc/nginx/sites-available/upavp-portal (symlinked in sites-enabled).
# Independent of the existing apps: wipzo.in (80/443) and the PM2 app on :8060.

# ---- http-level pieces (this file is included inside http{} through sites-enabled) ----------------
# Persistent connections to GeoServer: it is ~244 ms away from this server, so every new TCP
# connection would cost an extra round trip per tile.
upstream upavp_geoserver {
    server 162.245.218.6:8080;
    keepalive 16;
    keepalive_timeout 60s;
}

# Edge cache for finished map tiles (GetMap only). Kept small: this server's disk is tight.
proxy_cache_path /var/cache/nginx/upavp_tiles levels=1:2 keys_zone=upavp_tiles:10m
                 max_size=300m inactive=14d use_temp_path=off;
map $arg_request $upavp_skip_req {           # 1 = do not use / fill the cache
    default       1;
    ~*^getmap$    0;
}
# Browser caching: map tiles for a day, WFS JSON for 5 minutes (see $upavp_wfs_cache_control), everything else (errors, capabilities) never.
map "$arg_request|$upstream_http_content_type" $upavp_cache_control {
    default                      "no-store";
    "~*^getmap\|image/"          "public, max-age=86400";
}
map $upstream_http_content_type $upavp_skip_ct {   # never cache GeoServer error documents
    default       1;
    ~^image/      0;
}

# WFS (chart totals, "highlight this category", search lists): read-only JSON that is identical for every visitor, so it is cached
# for a few minutes and shared - the first visitor pays the 2-6 s GeoServer round trip, the next ones get it from this server.
# Only GetFeature answered with JSON is cached (GeoServer errors are XML and are never stored).
map $arg_request $upavp_wfs_skip_req {
    default           1;
    ~*^getfeature$    0;
}
map $upstream_http_content_type $upavp_wfs_skip_ct {   # anything that is not JSON (e.g. XML error documents) is never stored
    default                1;
    ~*^application/json    0;
}
map "$arg_request|$upstream_http_content_type" $upavp_wfs_cache_control {
    default                                  "no-store";
    "~*^getfeature\|application/json"        "public, max-age=300";
}

server {
    listen 8070;
    server_name _;

    root /var/www/upavp-portal/current/site;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # hashed build assets can be cached for a long time
    location ~* ^(/AwasVikas)?/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # dashboard (single-page app)
    location /AwasVikas/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /AwasVikas/index.html;
    }
    location = /AwasVikas { return 301 /AwasVikas/; }

    # GeoServer WFS (see the maps above): cached 10 minutes, shared by all visitors
    location ~ ^/geoserver/([A-Za-z0-9_]+/)?wfs$ {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://upavp_geoserver;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_buffering on;
        proxy_buffers 32 32k;

        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control $upavp_wfs_cache_control always;

        proxy_cache upavp_tiles;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 90s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $upavp_wfs_skip_req;
        proxy_no_cache $upavp_wfs_skip_req $upavp_wfs_skip_ct;
        add_header X-Edge-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
    }

    # GeoServer: only the OGC read endpoints the dashboard needs
    # (/geoserver/wms, /geoserver/<workspace>/wms|ows; WFS is the block above). No web UI, no REST.
    location ~ ^/geoserver/([A-Za-z0-9_]+/)?(wms|ows)$ {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://upavp_geoserver;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_buffering on;
        proxy_buffers 32 32k;

        # GeoServer marks tiles it serves from its own cache as no-cache/no-store (Expires: 0),
        # which would stop this cache from ever keeping them. We decide the caching policy here.
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control $upavp_cache_control always;

        proxy_cache upavp_tiles;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 2d;
        proxy_cache_lock on;                 # many users asking for the same new tile = one trip to GeoServer
        proxy_cache_lock_timeout 90s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $upavp_skip_req;
        proxy_no_cache $upavp_skip_req $upavp_skip_ct;
        add_header X-Edge-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /geoserver/ { return 404; }

    # login page
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
